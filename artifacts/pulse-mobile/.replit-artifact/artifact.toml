kind = "mobile"
previewPath = "/"
title = "Pulse"
description = "A supportive AI-powered nutrition companion for meal photo logging, personalized meal plans, and daily calorie and macro tracking, with English and Arabic RTL support."
version = "1.0.0"
id = "artifacts/pulse-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19454

[services.development]
run = "pnpm --filter @workspace/pulse-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pulse-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pulse-mobile", "run", "serve" ]

[services.env]
PORT = "19454"
BASE_PATH = "/"
